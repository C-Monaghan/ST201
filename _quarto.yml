project:
  type: website
  output-dir: docs

  render:
    - "*.qmd"
    - "!slides/"
    - "!assignments/solutions/"
    - "!_drafts/"

  preview:
    port: 4444

  resources:
    - "slides/output/"

website:
  title: "ST201: Data Analysis"
  favicon: ./assets/favicon.png

  site-url: https://c-monaghan.github.io/ST201
  repo-url: https://github.com/C-Monaghan/ST201

  page-navigation: true

  announcement:
    icon: pencil
    dismissable: false
    content: |
      **UPDATE:** See the assignment tab for your first practice assignment
    type: danger
    position: below-navbar

  navbar:
    pinned: true
    title: Data Analysis
    logo: ./assets/figures/favicon.png

    right:
      - text: Overview
        href: overview\index.qmd
      - text: Schedule
        href: schedule\index.qmd
      - text: Content
        href: content\index.qmd
      - text: Assignments
        menu:
          - text: Assignment 1
            href: assignments\assignment_01.qmd
          - text: Assignment 2
            # href: assignments\assignment_02.qmd
          - text: Assignment 3
            # href: assignments\assignment_03.qmd
          - text: Assignment 4
            # href: assignments\assignment_04.qmd

  sidebar:
    title: Content
    style: docked
    search: false
    background: light
    contents:
      - text: Lecture overview
        href: content\index.qmd
      - text: The foundations of data
        href: content\content_01.qmd
      - text: Numerical data
        href: content\content_02.qmd
      - text: Categorical data analysis I
        href: content\content_03.qmd
      - text: Categorical data analysis II
        href: content\content_04.qmd
      - text: Categorical data analysis III
        href: content\content_05.qmd


  page-footer:
    left: |
      Content {{< fa brands creative-commons >}} {{< var meta.copyright_year >}} by [{{< var author.name >}}]({{< var author.url >}}) <br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-NonCommercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/)
    right: |
      Made with {{< fa brands r-project >}}, [Quarto](https://quarto.org/), and {{< fa heart title='love' aria-hidden='true' >}}<br>
      [View the source at {{< fa brands github >}} GitHub]({{< var meta.project_source >}})

format:
  html:
    theme:
      - litera
      - html/custom.scss
    toc: true
    toc-location: right
    toc-title: On this page
    smooth-scroll: true
